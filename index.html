<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Rift</title>

<link rel="icon" type="image/png" sizes="32x32" href="./Rift.png">
<link rel="shortcut icon" type="image/png" href="./Rift.png">

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Scrim for mobile sidebar overlay -->
    <div class="scrim" id="scrim"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New chat
        </button>
        <button class="icon-btn sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-footer">
        <div class="credits">
          <p class="credits-title">Rift</p>
          <a href="mailto:you@example.com" class="credits-link">you@example.com</a>
          <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer" class="credits-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.7-1.28-1.7-1.04-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.67.8.56A10.52 10.52 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5Z"/></svg>
            GitHub
          </a>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-open-btn" id="sidebarOpenBtn" aria-label="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h1 class="chat-title" id="chatTitle">Rift</h1>
        <div class="topbar-spacer"></div>
      </header>

      <div class="chat-area" id="chatArea">
        <!-- Welcome screen -->
        <div class="welcome" id="welcome">
          <h2 class="welcome-heading">What can I help with?</h2>
          <div class="suggestion-grid" id="suggestionGrid">
            <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms">
              <span class="suggestion-title">Explain a concept</span>
              <span class="suggestion-sub">Quantum computing in simple terms</span>
            </button>
            <button class="suggestion-card" data-prompt="Write a short poem about the changing seasons">
              <span class="suggestion-title">Write something creative</span>
              <span class="suggestion-sub">A short poem about the seasons</span>
            </button>
            <button class="suggestion-card" data-prompt="Give me 5 tips to improve my productivity while working from home">
              <span class="suggestion-title">Get advice</span>
              <span class="suggestion-sub">Tips to improve productivity</span>
            </button>
            <button class="suggestion-card" data-prompt="Write a JavaScript function that debounces another function">
              <span class="suggestion-title">Help me code</span>
              <span class="suggestion-sub">A debounce function in JavaScript</span>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="composerInput"
            class="composer-input"
            placeholder="Message Rift..."
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
          </button>
        </div>
        <p class="composer-hint">Rift can make mistakes. Consider checking important information.</p>
      </div>
    </main>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 class="modal-title" id="modalTitle">Delete chat?</h3>
      <p class="modal-body" id="modalBody">This will permanently delete this conversation. This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="modal-btn modal-cancel" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn modal-delete" id="modalConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
```
